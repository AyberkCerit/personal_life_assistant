[package]
name = "pla-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "pla_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
notify-debouncer-full = "0.7.0"
pla-core = { path = "../../../crates/pla-core" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_Globalization"] }
