<text x="18" y="306" class="l">Gemma 4 E2B</text><text x="18" y="323" class="s muted">Q4_0 QAT</text>
<path d="M190,294 h384.0 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-384.0 z" fill="var(--s1)"/>
<text x="584.0" y="305" class="v">97%</text>
<path d="M190,310 h376.0 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-376.0 z" fill="var(--s2)"/>
