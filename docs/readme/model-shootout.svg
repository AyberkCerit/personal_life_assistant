<rect x="320" y="74" width="12" height="12" rx="3" fill="var(--s2)"/><text x="338" y="84" class="s">English notes</text>
<text x="680" y="84" class="s b">Working memory</text>
<line x1="190.0" y1="118" x2="190.0" y2="394" stroke="var(--grid)" stroke-width="1"/><text x="190.0" y="412" class="v muted" text-anchor="middle">0%</text>
<line x1="290.0" y1="118" x2="290.0" y2="394" stroke="var(--grid)" stroke-width="1"/><text x="290.0" y="412" class="v muted" text-anchor="middle">25%</text>
<line x1="390.0" y1="118" x2="390.0" y2="394" stroke="var(--grid)" stroke-width="1"/><text x="390.0" y="412" class="v muted" text-anchor="middle">50%</text>
<line x1="490.0" y1="118" x2="490.0" y2="394" stroke="var(--grid)" stroke-width="1"/><text x="490.0" y="412" class="v muted" text-anchor="middle">75%</text>
<line x1="590.0" y1="118" x2="590.0" y2="394" stroke="var(--grid)" stroke-width="1"/><text x="590.0" y="412" class="v muted" text-anchor="middle">100%</text>
<line x1="510.0" y1="114" x2="510.0" y2="394" stroke="var(--rule)" stroke-width="1.5"/><text x="506.0" y="110" class="v muted" text-anchor="end">required: 80%</text>
<line x1="680.0" y1="118" x2="680.0" y2="394" stroke="var(--grid)" stroke-width="1"/><text x="680.0" y="412" class="v muted" text-anchor="middle">0</text>
<line x1="716.3636363636364" y1="118" x2="716.3636363636364" y2="394" stroke="var(--grid)" stroke-width="1"/><text x="716.3636363636364" y="412" class="v muted" text-anchor="middle">1</text>
