<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-labelledby="t d"><title id="t">Model shoot-out: extraction accuracy and memory</title><desc id="d">Five local models on the same 200 Turkish and English notes. Gemma 4 E2B Q3_K_M reaches 96% (TR) and 95% (EN) field accuracy in 1.85 GB of working memory and is the model PLA ships.</desc>

<style>
  svg { --surface:#fbfbfc; --grid:#e3e6ec; --text:#2a2e37; --muted:#5d6472;
         --s1:#2a78d6; --s2:#eb6834; --accent:#0f7a63; --track:#d2f1e7; --dim:#b8bec9; --rule:#2a2e37; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1f2228; --grid:#2f343d; --text:#d2d6de; --muted:#9199a7;
           --s1:#3987e5; --s2:#d95926; --accent:#5fbea1; --track:#243c3c; --dim:#4a5160; --rule:#d2d6de; }
  }
  text { font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; fill:var(--text); }
  .muted { fill:var(--muted); }
  .t { font-size:15px; font-weight:600; }
  .s { font-size:12px; }
  .l { font-size:13px; }
  .v { font-size:12px; font-variant-numeric:tabular-nums; }
  .b { font-weight:650; }
</style>
<rect width="920" height="470" rx="12" fill="var(--surface)"/>
<text x="18" y="34" class="t">Extraction accuracy and memory: five local models on the same 200 notes</text>
<text x="18" y="56" class="s muted">Field accuracy = expected items extracted exactly right. llama.cpp b11280, CPU only, 4 threads, grammar-constrained JSON.</text>
