<text x="576.0" y="375" class="v">95%</text>
<path d="M680,352 h63.3 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-63.3 z" fill="var(--accent)"/>
<text x="753.2727272727273" y="366" class="v b">1.85 GB</text>
<text x="18" y="452" class="s muted">Dev set, 100 TR + 100 EN notes. On a separate held-out set written after the prompt was frozen, the shipped model scores 91% / 91%.</text>
