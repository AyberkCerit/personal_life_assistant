[package]
name = "pla-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
getrandom = "0.4.3"
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10.9"
strsim = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1.26.1", features = ["v4"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
